        </div>

         <img class="cat-photo inline-block w-full sm:w-[250px] h-[220px] sm:h-[300px] object-cover rounded-md border border-white" src="./asset/images/closeup-of-the-snout-of-a-sleeping-british-shorthair-kitten-of-silver-color-buried-in-a-blue-knitted-blanket-siberian-nevsky-masquerade-cat-color-point-high-quality-photo.jpg" alt="Cat 7">
