<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./asset/css/output.css"/>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg"/>
  <title>Cate Photo App</title>
</head>
<body>
    <div class="container flex flex-col items-center justify-center min-h-screen bg-gray-100">
        <div class="text-section flex flex-col items-center justify-center mb-8">
          <h1 class="text-[32px] font-bold">Cat Photo App</h1>
          <p class="text=[18px] text-white leading-[130%]">Welcome to the Cat Photo App! It's a simple app for viewing cat photos.</p>
        </div>

        <div class="photos-section flex flex-wrap justify-center gap-4 items-center">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/12551.jpg" alt="Cat 1" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/cats.jpg" alt="Cat 2" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/relaxing-cat.jpg" alt="Cat 3" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/running-cats.jpg" alt="Cat 4" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/sleeping-cat.jpg" alt="Cat 5" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/white-cat.jpg" alt="Cat 6" class="cat-photo">

          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/closeup-of-the-snout-of-a-sleeping-british-shorthair-kitten-of-silver-color-buried-in-a-blue-knitted-blanket-siberian-nevsky-masquerade-cat-color-point-high-quality-photo.jpg" alt="cat 7" class="cat-photo ">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/halloween-pumpkin-and-black-cat-on-festival-background-photo.jpg" alt="cat 8" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/close-up-of-a-cat-lying-on-the-bed-photo.jpg" alt="cat 9" class="cat-photo">
          <img  class="w-[150px] h-[100px] border border-white rounded-[5px]" src="./asset/images/realistic-close-up-of-cute-cat-sitting-on-fence-generative-ai-photo.jpg" alt="cat 10" class="cat-photo">
        </div>
    </div>
</body>
</html>
